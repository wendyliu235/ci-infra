steps:
- group: Hardware-Intel
  steps:
  - block: Run Intel XPU CI V1
    depends_on: []
    key: block-intel-xpu-ci-v1
  - label: Intel XPU CI V1
    agents:
      queue: intel-gpu
    commands:
    - 'export INTEL_XPU_IMAGE="intel/vllm:0.14.1-xpu"

      export VLLM_TEST_COMMANDS="$(cat <<"CMD"

      echo "ZE_AFFINITY_MASK=${ZE_AFFINITY_MASK:-}"

      pip install --no-cache-dir tblib==3.1.0

      cd /vllm-workspace || cd /workspace/vllm || true


      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 --enforce-eager

      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 -O3 -cc.cudagraph_mode=NONE

      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 --enforce-eager -tp 2 --distributed-executor-backend ray

      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 --enforce-eager -tp 2 --distributed-executor-backend mp

      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 --enforce-eager --attention-backend=TRITON_ATTN

      python3 examples/offline_inference/basic/generate.py --model facebook/opt-125m
      --block-size 64 --enforce-eager --quantization fp8


      cd tests

      pytest -v -s v1/core --ignore=v1/core/test_reset_prefix_cache_e2e.py --ignore=v1/core/test_scheduler_e2e.py

      pytest -v -s v1/engine

      pytest -v -s v1/sample --ignore=v1/sample/test_logprobs.py --ignore=v1/sample/test_logprobs_e2e.py

      pytest -v -s v1/worker --ignore=v1/worker/test_gpu_model_runner.py

      pytest -v -s v1/structured_output

      pytest -v -s v1/spec_decode --ignore=v1/spec_decode/test_max_len.py --ignore=v1/spec_decode/test_tree_attention.py
      --ignore=v1/spec_decode/test_speculators_eagle3.py --ignore=v1/spec_decode/test_acceptance_length.py

      pytest -v -s v1/kv_connector/unit --ignore=v1/kv_connector/unit/test_multi_connector.py
      --ignore=v1/kv_connector/unit/test_nixl_connector.py --ignore=v1/kv_connector/unit/test_example_connector.py
      --ignore=v1/kv_connector/unit/test_lmcache_integration.py

      pytest -v -s v1/test_serial_utils.py

      CMD

      )"

      bash .buildkite/scripts/hardware_ci/run-intel-test.sh

      '
    depends_on:
    - block-intel-xpu-ci-v1
    soft_fail: true
    retry:
      automatic:
      - exit_status: -1
        limit: 2
      - exit_status: -10
        limit: 2
      - exit_status: 128
        limit: 2
    priority: 100
